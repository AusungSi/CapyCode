[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nju-coding-agent"
version = "0.1.0"
description = "A profiled capability routing coding agent for the NJU assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
  "PyYAML>=6.0.2",
  "textual>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
  "types-PyYAML>=6.0.12.20250516",
]

[project.scripts]
capycode = "capycode.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capycode"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/capycode/profiling/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/capycode/app/tui.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["capycode"]

[tool.coverage.run]
source = ["capycode"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
